data:
  num_workers: 8

train:
  # Infrastructure-only changes for one real, four-GPU training transaction.
  # The preparation script overlays these leaves on the pinned upstream config
  # and rejects any unlisted override.
  enable_gradient_checkpointing: true
  use_compile: false
  use_wandb: false
  enable_resume: false
  micro_batch_size: 1
  global_batch_size: 4
  gradient_accumulation_steps: 1
  max_steps: 1
  save_steps: 1
  save_epochs: 0
  # The synchronous upstream path converts the final checkpoint twice. Its
  # asynchronous path de-duplicates by checkpoint path and is awaited at exit.
  async_save_hf_weights: true
